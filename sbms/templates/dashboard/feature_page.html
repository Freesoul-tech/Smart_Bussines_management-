<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title|default:'Feature Page' }} | SBMS</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #f9fbff 0%, #eef3ff 100%);
            color: #16233d;
        }
        .wrap {
            max-width: 900px;
            margin: 60px auto;
            padding: 32px;
            background: rgba(255,255,255,0.9);
            border-radius: 24px;
            border: 1px solid rgba(15,23,42,0.08);
            box-shadow: 0 18px 45px rgba(31,41,55,0.08);
        }
        h1 { margin-top: 0; color: #4f46e5; }
        p { font-size: 1rem; line-height: 1.7; color: #64748b; }
        a {
            display: inline-block;
            margin-top: 12px;
            text-decoration: none;
            color: white;
            background: #4f46e5;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>{{ page_title|default:'Feature Page' }}</h1>
        <p>{{ summary|default:'This feature page is ready for the next business workflow.' }}</p>
        <a href="/">Back to Dashboard</a>
    </div>
</body>
</html>
